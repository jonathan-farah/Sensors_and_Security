name: docs
# Build documentation
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build docs
      uses: TinyTapeout/tt-gds-action/docs@tt08
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
